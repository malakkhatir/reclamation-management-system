<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-white to-gray-50 p-4">
  <mat-card class="w-full max-w-md p-6 shadow-2xl rounded-2xl border border-gray-200/50">
    <div class="flex flex-col items-center mb-6">
      <div class="w-16 h-16 bg-gradient-to-br from-blue-900 to-blue-700 rounded-2xl flex items-center justify-center mb-3 shadow-lg shadow-blue-500/30">
        <mat-icon class="text-white text-3xl">person_add</mat-icon>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Créer un compte</h1>
      <p class="text-sm text-gray-500">Rejoignez la plateforme</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Nom complet</mat-label>
        <input matInput formControlName="nom" placeholder="Jean Dupont">
        <mat-icon matSuffix>person</mat-icon>
        <mat-error *ngIf="registerForm.get('nom')?.invalid && registerForm.get('nom')?.touched">
          Nom requis (min 2 caractères)
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" placeholder="exemple@domaine.com">
        <mat-icon matSuffix>email</mat-icon>
        <mat-error *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          Email requis et valide
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Mot de passe</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="••••••••">
        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          Mot de passe requis (min 6 caractères)
        </mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit"
              class="w-full !bg-blue-900 !text-white py-2 text-lg font-semibold hover:!bg-blue-800 transition-all">
        S'inscrire
      </button>
    </form>

    <div class="text-center mt-6 text-sm">
      <span class="text-gray-600">Déjà un compte ?</span>
      <a routerLink="/login" class="text-blue-900 font-medium hover:underline ml-1">Connectez-vous</a>
    </div>
  </mat-card>
</div>
